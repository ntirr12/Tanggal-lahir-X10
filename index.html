<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Ulang Tahun X-10</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Cdn untuk efek Confetti 🎉 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-highlight: rgba(255, 255, 255, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --gold: #fbbf24;
            --green: #34d399;
            --pink: #f472b6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #020617;
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Latar Belakang Cepat & Ringan (Tanpa Blur) */
        .liquid-blob {
            position: fixed;
            border-radius: 50%;
            opacity: 0.15; 
            z-index: -1;
            animation: liquidMove 30s infinite alternate linear;
        }
        .blob-1 { width: 50vw; height: 50vw; background: #0ea5e9; top: -10%; left: -10%; }
        .blob-2 { width: 40vw; height: 40vw; background: #8b5cf6; bottom: -10%; right: -10%; animation-delay: -5s; }
        
        @keyframes liquidMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 10%) scale(1.1); }
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-border-highlight);
            border-left: 1px solid var(--glass-border-highlight);
            border-radius: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #current-time {
            display: inline-block;
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
            background: rgba(255,255,255,0.05);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        /* --- DASHBOARD STATISTIK KELAS --- */
        .dashboard-stats {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .stat-box {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
        }

        .stat-icon {
            font-size: 1.8rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            border: 1px solid var(--glass-border);
        }

        .stat-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: capitalize;
        }
        .stat-value.highlight { color: var(--accent); }

        /* Controls: Search & Sort */
        .controls-container {
            max-width: 1200px;
            margin: 0 auto 24px auto;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .glass-input {
            flex-grow: 1;
            padding: 14px 24px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            min-width: 200px;
        }
        
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--glass-border-highlight);
        }

        .glass-select {
            padding: 14px 24px;
            border-radius: 16px;
            background: #0f172a;
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
            min-width: 220px;
        }

        /* Grid */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .student-card {
            padding: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-radius: 20px;
        }

        /* Efek Khusus Untuk yang Ulang Tahun Hari Ini */
        .card-bday-today {
            background: linear-gradient(145deg, rgba(245, 158, 11, 0.15), rgba(239, 68, 68, 0.08));
            border: 1px solid rgba(245, 158, 11, 0.5);
            border-top: 1px solid rgba(245, 158, 11, 0.7);
            border-left: 1px solid rgba(245, 158, 11, 0.7);
            animation: pulse-glow 2s infinite alternate;
        }

        @keyframes pulse-glow {
            from { box-shadow: 0 0 10px rgba(245, 158, 11, 0.2); }
            to { box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--glass-border-highlight);
            padding-bottom: 16px;
        }

        .name-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .no-badge {
            font-size: 0.8rem;
            color: var(--text-main);
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
        }

        .student-name {
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: capitalize;
            letter-spacing: 0.3px;
        }
        
        .badges-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .zodiac-badge, .shio-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .info-value.highlight {
            color: var(--accent);
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 4px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 10px;
            transition: width 1s ease-in-out;
        }

        .countdown-row {
            background: rgba(0,0,0,0.3);
            padding: 14px 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            border: 1px solid rgba(255,255,255,0.02);
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .countdown-val {
            font-weight: 700;
            color: var(--text-main);
        }

        .soon-badge {
            background: rgba(52, 211, 153, 0.15);
            color: var(--green);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .today-badge {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: white;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 800;
            border: none;
            letter-spacing: 0.5px;
        }

        .missing-data {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px 0;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
        }

        @media (max-width: 768px) {
            .controls-container { flex-direction: column; }
            .glass-select { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="liquid-blob blob-1"></div>
    <div class="liquid-blob blob-2"></div>

    <header>
        <h1>ULTAH X-10 🥳</h1>
        <div id="current-time">Memuat waktu...</div>
    </header>

    <!-- Dashboard Statistik Kelas -->
    <div class="dashboard-stats" id="dashboard-stats">
        <div class="stat-box glass-panel">
            <div class="stat-icon">🎂</div>
            <div class="stat-info">
                <span class="stat-title">Bulan Ini</span>
                <span class="stat-value highlight" id="stat-bulan-ini">0 Orang</span>
            </div>
        </div>
        <div class="stat-box glass-panel">
            <div class="stat-icon">👑</div>
            <div class="stat-info">

                <span class="stat-value" id="stat-tertua">-</span>
            </div>
        </div>
        <div class="stat-box glass-panel">
            <div class="stat-icon">👶</div>
            <div class="stat-info">
                <span class="stat-title">Paling Muda (Bocil)</span>
                <span class="stat-value" id="stat-termuda">-</span>
            </div>
        </div>
        <div class="stat-box glass-panel">
            <div class="stat-icon">📊</div>
            <div class="stat-info">
                <span class="stat-title">Rata-Rata Umur</span>
                <span class="stat-value" id="stat-ratarata">-</span>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls-container">
        <input type="text" id="searchInput" class="glass-input" placeholder="🔍 Cari nama temanmu..." onkeyup="renderCards()">
        <select id="sortSelect" class="glass-select" onchange="renderCards()">
            <option value="no">🔢 Urutkan: No. Absen (Default)</option>
            <option value="terdekat">🎯 Urutkan: Paling Dekat Ultah</option>
            <option value="nama">🔤 Urutkan: Nama (A-Z)</option>
            <option value="umur_tua">👴 Urutkan: Umur (Tua ke Muda)</option>
            <option value="umur_muda">👶 Urutkan: Umur (Muda ke Tua)</option>
        </select>
    </div>

    <div class="container" id="cards-container">
        <!-- Cards injected via JS -->
    </div>

    <script>
        // Mendapatkan tanggal hari ini
        const today = new Date();
        const currentYear = today.getFullYear();
        const currentMonthStr = String(today.getMonth() + 1).padStart(2, '0');
        const currentDayStr = String(today.getDate()).padStart(2, '0');
        
        // Data Siswa - UPDATE Diny's DOB ke Hari Ini Tahun 2011
        const dataSiswa = [
            { no: 1, nama: "akmal", dob: "2010-06-08" },
            { no: 2, nama: "ali topan", dob: "2010-09-18" },
            { no: 3, nama: "alinda", dob: "2010-10-02" },
            { no: 4, nama: "anggra", dob: null },
            { no: 5, nama: "ayu", dob: "2011-03-05" },
            { no: 6, nama: "citra", dob: "2010-09-28" },
            { no: 7, nama: "dilla", dob: "2010-11-15" },
            { no: 8, nama: "dinda", dob: "2011-03-06" },
            { no: 9, nama: "diny", dob: "2010-08-22" },
            { no: 10, nama: "fatir", dob: "2010-03-21" },
            { no: 11, nama: "fauziah", dob: "2011-05-02" },

            { no: 28, nama: "rezka", dob: "2010-09-05" },
            { no: 29, nama: "rizki M", dob: "2010-04-29" },
            { no: 30, nama: "rizky N", dob: "2011-04-28" },
            { no: 31, nama: "salfa", dob: "2010-10-06" },
            { no: 32, nama: "sena", dob: "2010-12-02" },
            { no: 33, nama: "sesi", dob: "2010-09-30" },
            { no: 34, nama: "widi", dob: null },
            { no: 35, nama: "willi", dob: "2010-08-06" }
        ];

        function getZodiac(dateString) {
            if(!dateString) return null;
            const d = new Date(dateString);
            const day = d.getDate();
            const month = d.getMonth() + 1;

            if ((month == 1 && day <= 19) || (month == 12 && day >= 22)) return { name: "Capricorn", emoji: "♑" };
            if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return { name: "Aquarius", emoji: "♒" };
            if ((month == 2 && day >= 19) || (month == 3 && day <= 20)) return { name: "Pisces", emoji: "♓" };
            if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return { name: "Aries", emoji: "♈" };
            if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return { name: "Taurus", emoji: "♉" };
            if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return { name: "Gemini", emoji: "♊" };
            if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return { name: "Cancer", emoji: "♋" };
            if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return { name: "Leo", emoji: "♌" };
            if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return { name: "Virgo", emoji: "♍" };
            if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return { name: "Libra", emoji: "♎" };
            if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return { name: "Scorpio", emoji: "♏" };
            if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return { name: "Sagittarius", emoji: "♐" };
            return null;
        }

        function getShio(year) {
            if(!year) return null;
            const shioList = [
                { name: "Tikus", emoji: "🐀" }, { name: "Kerbau", emoji: "🐂" }, { name: "Macan", emoji: "🐅" },
                { name: "Kelinci", emoji: "🐇" }, { name: "Naga", emoji: "🐉" }, { name: "Ular", emoji: "🐍" },
                { name: "Kuda", emoji: "🐎" }, { name: "Kambing", emoji: "🐐" }, { name: "Monyet", emoji: "🐒" },
                { name: "Ayam", emoji: "🐓" }, { name: "Anjing", emoji: "🐕" }, { name: "Babi", emoji: "🐖" }
            ];
            return shioList[(year - 4) % 12];
        }

        function formatDate(dateString) {
            const options = { day: '2-digit', month: 'long', year: 'numeric' };
            return new Date(dateString).toLocaleDateString('id-ID', options);
        }

        function calculateAgeStats(dobString, todayDate) {
            if (!dobString) return null;
            
            const dob = new Date(dobString);
            let years = todayDate.getFullYear() - dob.getFullYear();
            let months = todayDate.getMonth() - dob.getMonth();
            let days = todayDate.getDate() - dob.getDate();

            if (days < 0) {
                months--;
                const prevMonth = new Date(todayDate.getFullYear(), todayDate.getMonth(), 0);
                days += prevMonth.getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            let nextBday = new Date(todayDate.getFullYear(), dob.getMonth(), dob.getDate());
            const todayDateOnly = new Date(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate());
            
            if (todayDateOnly.getTime() > nextBday.getTime()) {
                nextBday.setFullYear(todayDate.getFullYear() + 1);
            }
            
            const diffBdayTime = nextBday.getTime() - todayDateOnly.getTime();
            const daysToNextBday = Math.ceil(diffBdayTime / (1000 * 60 * 60 * 24));
            
            // Hitung persentase progress menuju ultah (asumsi 365 hari/tahun)
            const progress = Math.max(0, Math.min(100, ((365 - daysToNextBday) / 365) * 100));

            return { years, months, days, daysToNextBday, progress, yearOfBirth: dob.getFullYear() };
        }

        function updateClassDashboard(todayDate) {
            let currentMonthCount = 0;
            const currentMonth = todayDate.getMonth();
            
            const validStudents = dataSiswa.filter(s => s.dob);
            if (validStudents.length === 0) return;

            let oldest = validStudents[0];
            let youngest = validStudents[0];
            let totalAgeInMs = 0;
            const todayMs = todayDate.getTime();

            validStudents.forEach(s => {
                const bdayDate = new Date(s.dob);
                const bdayMs = bdayDate.getTime();
                
                if(bdayDate.getMonth() === currentMonth) currentMonthCount++;

                if (bdayMs < new Date(oldest.dob).getTime()) oldest = s;
                if (bdayMs > new Date(youngest.dob).getTime()) youngest = s;

                totalAgeInMs += (todayMs - bdayMs);
            });

            const avgAgeInMs = totalAgeInMs / validStudents.length;
            const avgYears = Math.floor(avgAgeInMs / (1000 * 60 * 60 * 24 * 365.25));
            const avgMonths = Math.floor((avgAgeInMs % (1000 * 60 * 60 * 24 * 365.25)) / (1000 * 60 * 60 * 24 * 30.44));

            document.getElementById('stat-bulan-ini').innerText = `${currentMonthCount} Orang`;
            document.getElementById('stat-tertua').innerHTML = `${oldest.nama} <span style="font-size:0.75rem; color:#94a3b8">(${oldest.dob.substring(0,4)})</span>`;
            document.getElementById('stat-termuda').innerHTML = `${youngest.nama} <span style="font-size:0.75rem; color:#94a3b8">(${youngest.dob.substring(0,4)})</span>`;
            document.getElementById('stat-ratarata').innerText = `${avgYears} Thn ${avgMonths} Bln`;
        }

        let confettiFired = false;

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            
            const todayDate = new Date();
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;

            let displayData = dataSiswa.map(person => {
                const stats = calculateAgeStats(person.dob, todayDate);
                const zodiak = getZodiac(person.dob);
                const shio = stats ? getShio(stats.yearOfBirth) : null;
                const isToday = stats && stats.daysToNextBday === 0;
                return { ...person, stats, zodiak, shio, isToday };
            });

            // Trigger Confetti jika ada yang ultah hari ini (hanya sekali)
            const hasBdayToday = displayData.some(p => p.isToday);
            if(hasBdayToday && !confettiFired) {
                setTimeout(() => {
                    confetti({
                        particleCount: 150,
                        spread: 80,
                        origin: { y: 0.6 },
                        colors: ['#38bdf8', '#fbbf24', '#f472b6', '#34d399']
                    });
                }, 500);
                confettiFired = true;
            }

            if(searchQuery) {
                displayData = displayData.filter(p => p.nama.toLowerCase().includes(searchQuery));
            }

            displayData.sort((a, b) => {
                if (a.isToday && !b.isToday) return -1;
                if (!a.isToday && b.isToday) return 1;

                if(sortBy === 'nama') return a.nama.localeCompare(b.nama);
                if(sortBy === 'terdekat') {
                    if(!a.stats) return 1;
                    if(!b.stats) return -1;
                    return a.stats.daysToNextBday - b.stats.daysToNextBday;
                }
                if(sortBy === 'umur_tua') {
                    if(!a.dob) return 1;
                    if(!b.dob) return -1;
                    return new Date(a.dob).getTime() - new Date(b.dob).getTime();
                }
                if(sortBy === 'umur_muda') {
                    if(!a.dob) return 1;
                    if(!b.dob) return -1;
                    return new Date(b.dob).getTime() - new Date(a.dob).getTime();
                }
                return a.no - b.no; // Default (No. Absen)
            });

            const fragment = document.createDocumentFragment();

            displayData.forEach((person) => {
                const card = document.createElement('div');
                card.className = `student-card glass-panel ${person.isToday ? 'card-bday-today' : ''}`;
                
                let contentHTML = '';

                if (person.stats) {
                    let bdayBadge = '';
                    if (person.stats.daysToNextBday === 0) {
                        bdayBadge = '<span class="today-badge">🎉 HARI INI!</span>';
                    } else if (person.stats.daysToNextBday <= 30) {
                        bdayBadge = '<span class="soon-badge">⏳ Sebentar Lagi</span>';
                    }

                    // Tambahan Fitur: Sweet 17/KTP Indicator
                    let nextAge = person.stats.years + 1;
                    if(person.stats.daysToNextBday === 0) nextAge = person.stats.years; 
                    let milestone = '';
                    if (nextAge === 17 && person.stats.daysToNextBday !== 0) {
                        milestone = ' <span style="color:#f472b6; font-size:0.75rem;">(Sweet 17 🪪)</span>';
                    } else if (person.stats.years === 17 && person.stats.daysToNextBday === 0) {
                        milestone = ' <span style="color:#f472b6; font-size:0.75rem;">(Sudah Punya KTP! 🪪)</span>';
                    }

                    contentHTML = `
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">Tgl Lahir</span>
                                <span class="info-value">${formatDate(person.dob)}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Usia Sekarang</span>
                                <span class="info-value highlight">${person.stats.years} Thn, ${person.stats.months} Bln</span>
                            </div>
                        </div>
                        <div class="countdown-row">
                            <div style="flex-grow:1;">
                                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:5px;">
                                    <div class="info-item" style="gap:2px;">
                                        <span class="info-label">Ultah Ke-${nextAge}${milestone}</span>
                                        <span class="countdown-val">${person.stats.daysToNextBday} Hari lagi</span>
                                    </div>
                                    ${bdayBadge}
                                </div>
                                <div class="progress-container">
                                    <div class="progress-bar" style="width: ${person.stats.progress}%"></div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    contentHTML = `
                        <div class="missing-data">
                            ⚠️ Data tanggal lahir belum tersedia
                        </div>
                    `;
                }

                const badgesHTML = person.zodiak ? `
                    <div class="badges-wrapper">
                        <div class="zodiac-badge" title="Zodiak Bintang">${person.zodiak.emoji} ${person.zodiak.name}</div>
                        ${person.shio ? `<div class="shio-badge" title="Shio (Chinese Zodiac)">${person.shio.emoji} Shio ${person.shio.name}</div>` : ''}
                    </div>
                ` : '';

                card.innerHTML = `
                    <div class="card-header">
                        <div class="name-wrapper">
                            <span class="no-badge">${person.no}</span>
                            <span class="student-name">${person.nama}</span>
                        </div>
                        ${badgesHTML}
                    </div>
                    ${contentHTML}
                `;
                fragment.appendChild(card);
            });
            
            container.appendChild(fragment);
        }

        let lastMinute = -1;
        function updateClock() {
            const now = new Date();
            if (now.getMinutes() !== lastMinute) {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' };
                document.getElementById('current-time').innerText = now.toLocaleDateString('id-ID', options).replace(/\./g, ':');
                lastMinute = now.getMinutes();
            }
        }

        // Init
        document.getElementById('sortSelect').value = 'no'; 
        updateClassDashboard(today);
        renderCards();
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
